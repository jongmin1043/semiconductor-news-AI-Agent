name: Daily Semiconductor News Mail

on:
  schedule:
    - cron: "13 0 * * *"
  workflow_dispatch:

jobs:
  send-news-mail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send daily semiconductor news email
        env:
          GEMINIAPIKEY: ${{ secrets.GEMINIAPIKEY }}
          GMAILADDRESS: ${{ secrets.GMAILADDRESS }}
          GMAILAPPPASSWORD: ${{ secrets.GMAILAPPPASSWORD }}
          TOEMAIL: ${{ secrets.TOEMAIL }}
        run: python daily_email.py
